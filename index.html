<!DOCTYPE html>
<html lang="fr" data-fr-scheme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projet ARIANE</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.15.4/dist/dsfr.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.15.4/dist/utility/icons/icons-system/icons-system.min.css">
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    [hidden] { display: none !important; }

    .entete-statut {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      align-items: flex-start;
    }
    @media (min-width: 768px) {
      .entete-statut { align-items: flex-end; }
    }
    .entete-statut .fr-select-group { margin-bottom: 0; width: 100%; max-width: 16rem; }

    .champ-lecture .libelle {
      font-size: 0.875rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }
    .champ-lecture p { margin-bottom: 0; }

    .liste-brute { list-style: none; margin: 0; padding: 0; }
    .etape {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--border-default-grey);
    }
    .etape .fr-checkbox-group { margin: 0; flex: 1; }
    .etape .fr-btn { flex-shrink: 0; }
  </style>
</head>
<body>
  <main class="fr-container fr-py-3w">

    <!-- Messages d'état -->
    <div id="message-vide" class="fr-alert fr-alert--info fr-alert--sm fr-mb-3w">
      <p>Sélectionnez une ligne de la table pour afficher le projet.</p>
    </div>
    <div id="message-config" class="fr-alert fr-alert--warning fr-alert--sm fr-mb-3w" hidden>
      <p>Associez les colonnes du widget dans le panneau de droite (colonne « Titre » obligatoire).</p>
    </div>
    <div id="message-erreur" class="fr-alert fr-alert--error fr-alert--sm fr-mb-3w" hidden>
      <p></p>
    </div>

    <div id="application" hidden>

      <!-- Titre à gauche, statut à droite -->
      <div class="fr-grid-row fr-grid-row--middle fr-grid-row--gutters">
        <div class="fr-col-12 fr-col-md-8">
          <h1 class="fr-h4 fr-mb-0" id="titre"></h1>
        </div>
        <div class="fr-col-12 fr-col-md-4 entete-statut">
          <p class="fr-badge fr-badge--sm fr-badge--no-icon" id="statut-badge"></p>
          <div class="fr-select-group">
            <label class="fr-label" for="statut">Statut</label>
            <select class="fr-select" id="statut"></select>
          </div>
        </div>
      </div>

      <!-- Responsable -->
      <div class="fr-input-group fr-mt-3w">
        <label class="fr-label" for="responsable">Responsable du projet</label>
        <input class="fr-input" id="responsable" type="text" data-champ="responsable">
      </div>

      <!-- Catégorie / sous-catégorie (lecture seule) -->
      <div class="fr-grid-row fr-grid-row--gutters fr-mt-2w">
        <div class="fr-col-12 fr-col-md-6 champ-lecture">
          <p class="libelle">Catégorie</p>
          <p id="categorie"></p>
        </div>
        <div class="fr-col-12 fr-col-md-6 champ-lecture">
          <p class="libelle">Sous-catégorie</p>
          <p id="sous-categorie"></p>
        </div>
      </div>

      <!-- Descriptif -->
      <div class="fr-input-group fr-mt-3w">
        <label class="fr-label" for="descriptif">Descriptif du projet</label>
        <textarea class="fr-input" id="descriptif" rows="5" data-champ="descriptif"></textarea>
      </div>

      <hr class="fr-hr fr-mt-3w">

      <!-- Missions / échéance (lecture seule) -->
      <div class="fr-grid-row fr-grid-row--gutters">
        <div class="fr-col-12 fr-col-md-8 champ-lecture">
          <p class="libelle">Missions fondatrices rattachées</p>
          <p id="missions"></p>
        </div>
        <div class="fr-col-12 fr-col-md-4 champ-lecture">
          <p class="libelle">Échéance</p>
          <p id="echeance"></p>
        </div>
      </div>

      <hr class="fr-hr fr-mt-3w">

      <!-- Agents ARIANE : liste déroulante à sélection multiple -->
      <div class="fr-select-group">
        <label class="fr-label" for="agents-select">
          Agents ARIANE concernés
          <span class="fr-hint-text">Sélectionnez un ou plusieurs agents dans la liste</span>
        </label>
        <select class="fr-select" id="agents-select"></select>
      </div>
      <div class="fr-tags-group fr-mt-1w" id="agents-tags"></div>

      <!-- Autres agents / interlocuteurs -->
      <div class="fr-input-group fr-mt-3w">
        <label class="fr-label" for="autres-agents">Autres agents concernés</label>
        <input class="fr-input" id="autres-agents" type="text" data-champ="autres_agents">
      </div>
      <div class="fr-input-group">
        <label class="fr-label" for="autres-interlocuteurs">Autres interlocuteurs concernés</label>
        <input class="fr-input" id="autres-interlocuteurs" type="text" data-champ="autres_interlocuteurs">
      </div>

      <!-- Liens -->
      <div class="fr-input-group">
        <label class="fr-label" for="lien-ressource">Lien ressource</label>
        <input class="fr-input" id="lien-ressource" type="url" placeholder="https://…" data-champ="lien_ressource">
        <p class="fr-mt-1v fr-mb-0">
          <a class="fr-link fr-icon-external-link-line fr-link--icon-right" id="lien-ressource-ouvrir"
             target="_blank" rel="noopener noreferrer" hidden></a>
        </p>
      </div>
      <div class="fr-input-group">
        <label class="fr-label" for="lien-article">Lien vers l'article de presse</label>
        <input class="fr-input" id="lien-article" type="url" placeholder="https://…" data-champ="lien_article_presse">
        <p class="fr-mt-1v fr-mb-0">
          <a class="fr-link fr-icon-external-link-line fr-link--icon-right" id="lien-article-ouvrir"
             target="_blank" rel="noopener noreferrer" hidden></a>
        </p>
      </div>

      <hr class="fr-hr fr-mt-3w">

      <!-- Étapes -->
      <h2 class="fr-h6">Étapes</h2>
      <form id="etape-form" class="fr-grid-row fr-grid-row--gutters fr-grid-row--bottom">
        <div class="fr-col-12 fr-col-md-6">
          <div class="fr-input-group fr-mb-0">
            <label class="fr-label" for="etape-texte">Étape</label>
            <input class="fr-input" id="etape-texte" type="text" required>
          </div>
        </div>
        <div class="fr-col-12 fr-col-md-3">
          <div class="fr-input-group fr-mb-0">
            <label class="fr-label" for="etape-date">Date de réalisation</label>
            <input class="fr-input" id="etape-date" type="date">
          </div>
        </div>
        <div class="fr-col-12 fr-col-md-3">
          <button class="fr-btn fr-btn--secondary fr-icon-add-line fr-btn--icon-left" type="submit">Ajouter l'étape</button>
        </div>
      </form>
      <ul class="liste-brute fr-mt-2w" id="etapes-liste"></ul>

    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
